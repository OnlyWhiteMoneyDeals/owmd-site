name: Deploy to Cloudflare Pages

on:
  # ✅ PRODUCTION: Deploy to production when code is pushed/merged to main
  push:
    branches:
      - main

  # ✅ PREVIEW: Deploy a preview URL on every Pull Request (requires your approval to merge)
  pull_request:
    types: [opened, synchronize, reopened]

  # ✅ MANUAL: Trigger a deploy manually from GitHub Actions tab
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write   # Allows posting preview URL as a PR comment

    steps:
      # Step 1: Check out the latest code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Deploy to Cloudflare Pages via Wrangler
      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy . --project-name=owmd-site --commit-dirty=true
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Post preview URL as a comment on the Pull Request
      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentUrl = '${{ steps.deploy.outputs.deployment-url }}';
            const branch = context.payload.pull_request.head.ref;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);

            const body = `## 🚀 Preview Deployment Ready!

            | Field | Value |
            |-------|-------|
            | 🔗 **Preview URL** | ${deploymentUrl} |
            | 🌿 **Branch** | \`${branch}\` |
            | 📝 **Commit** | \`${sha}\` |
            | ⏱ **Status** | ✅ Live |

            > **Review the preview above, then merge this PR to push changes to production.**
            > Production site: https://owmd-site.pages.dev`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
