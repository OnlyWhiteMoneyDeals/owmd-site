name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Wrangler
        run: npm install -g wrangler@latest

      - name: Verify token and project
        run: |
          echo "Account ID: $CLOUDFLARE_ACCOUNT_ID"
          wrangler pages project list
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          wrangler pages deploy . \
            --project-name=owmd-site \
            --branch=${{ github.head_ref || 'main' }} \
            --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const sha = context.payload.pull_request.head.sha.substring(0, 7);
            const deploymentUrl = `https://${branch.replace(/[^a-z0-9]/gi, '-').toLowerCase()}.owmd-site.pages.dev`;
            const body = `## 🚀 Preview Deployment Ready!\n\n| Field | Value |\n|-------|-------|\n| 🔗 **Preview URL** | ${deploymentUrl} |\n| 🌿 **Branch** | \`${branch}\` |\n| 📝 **Commit** | \`${sha}\` |\n| ⏱ **Status** | ✅ Live |\n\n> Review the preview, then merge this PR to push to production.\n> Production: https://owmd-site.pages.dev`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
