<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Only White Money Deals</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<link rel="icon" type="image/png" href="assets/logo1.png">
<style>
:root{--purple:#6B1FA8;--purple-dark:#5B21B6;--purple-light:#8B5CF6;--purple-bg:#F5F3FF;--black:#111111;--white:#FFFFFF;--off-white:#F8F9FA;--text:#1A1A2E;--muted:#6B7280;--border:#E5E7EB;--radius:12px;--shadow:0 4px 24px rgba(139,53,200,0.12);--shadow-lg:0 12px 48px rgba(139,53,200,0.2);--transition:all 0.3s ease;--green:#059669;--red:#DC2626;--amber:#D97706}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;overflow-x:hidden}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--off-white);min-height:100vh}
h1,h2,h3,h4{font-family:'Playfair Display',serif}
a{text-decoration:none;color:inherit}
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1A1A2E 0%,#2D1B69 100%);padding:20px}
.login-card{background:#fff;border-radius:24px;padding:48px 40px;width:100%;max-width:420px;box-shadow:0 24px 80px rgba(0,0,0,0.4)}
.login-logo{text-align:center;margin-bottom:32px}
.login-logo img{max-width:200px;height:auto;display:block;margin:0 auto}
.login-logo p{font-size:0.78rem;color:var(--muted);margin-top:8px;font-weight:600;letter-spacing:0.05em;text-transform:uppercase}
.login-title{font-size:1.4rem;text-align:center;margin-bottom:28px;color:var(--text)}
.login-group{margin-bottom:18px}
.login-group label{display:block;font-size:0.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:6px}
.login-group input{width:100%;border:1.5px solid #E5E7EB;border-radius:10px;padding:12px 14px;font-size:0.95rem;font-family:inherit;color:var(--text);transition:var(--transition)}
.login-group input:focus{outline:none;border-color:var(--purple);box-shadow:0 0 0 3px rgba(107,31,168,0.1)}
.btn-login{width:100%;background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;border:none;padding:14px;border-radius:10px;font-weight:700;font-size:1rem;cursor:pointer;transition:var(--transition);font-family:inherit;margin-top:8px}
.btn-login:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.login-error{display:none;color:#DC2626;font-size:0.82rem;text-align:center;margin-top:10px;font-weight:600}
.login-error.show{display:block}
.dashboard{display:none;min-height:100vh;background:var(--off-white)}
.dashboard.active{display:block}
.dash-header{background:linear-gradient(135deg,var(--purple),var(--purple-dark));color:#fff;padding:0}
.dash-header-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.dash-logo{display:flex;align-items:center;gap:12px}
.dash-logo img{max-height:40px}.dash-logo-pill{background:#fff;border-radius:8px;padding:4px 10px;display:flex;align-items:center}.dash-logo-pill img{max-height:32px;width:auto;display:block}
.dash-logo span{font-size:1rem;font-weight:700;opacity:0.9}
.dash-header-right{display:flex;align-items:center;gap:12px}
.dash-badge{background:rgba(255,255,255,0.15);padding:4px 12px;border-radius:50px;font-size:0.75rem;font-weight:700;letter-spacing:0.05em}
.btn-logout{background:rgba(255,255,255,0.15);color:#fff;border:1px solid rgba(255,255,255,0.3);padding:8px 16px;border-radius:8px;font-size:0.82rem;font-weight:700;cursor:pointer;transition:var(--transition);font-family:inherit}
.btn-logout:hover{background:rgba(255,255,255,0.25)}
.dash-content{max-width:1400px;margin:0 auto;padding:32px 24px}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;margin-bottom:32px}
.stat-card{background:#fff;border-radius:16px;padding:24px;border:1px solid #E5E7EB;box-shadow:var(--shadow);position:relative;overflow:hidden}
.stat-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px}
.stat-card.purple::before{background:linear-gradient(90deg,var(--purple),var(--purple-light))}
.stat-card.green::before{background:linear-gradient(90deg,#10B981,#059669)}
.stat-card.amber::before{background:linear-gradient(90deg,#F59E0B,#D97706)}
.stat-card.blue::before{background:linear-gradient(90deg,#3B82F6,#1D4ED8)}
.stat-icon{font-size:2rem;margin-bottom:12px}
.stat-value{font-size:2.5rem;font-weight:900;font-family:'Playfair Display',serif;line-height:1;margin-bottom:4px}
.stat-label{font-size:0.78rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:0.06em}
.tabs{display:flex;gap:4px;background:#fff;padding:6px;border-radius:14px;border:1px solid #E5E7EB;box-shadow:var(--shadow);margin-bottom:24px;width:fit-content}
.tab-btn{padding:10px 24px;border-radius:10px;border:none;font-size:0.88rem;font-weight:700;cursor:pointer;transition:var(--transition);color:var(--muted);background:none;font-family:inherit}
.tab-btn.active{background:var(--purple);color:#fff;box-shadow:0 4px 12px rgba(107,31,168,0.3)}
.tab-btn:hover:not(.active){background:var(--purple-bg);color:var(--purple)}
.tab-panel{display:none}.tab-panel.active{display:block}
.panel-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px}
.panel-title{font-size:1.1rem;font-weight:700;color:var(--text)}
.table-wrap{background:#fff;border-radius:16px;border:1px solid #E5E7EB;box-shadow:var(--shadow);overflow:hidden}
.admin-table{width:100%;border-collapse:collapse}
.admin-table th{background:var(--purple-bg);color:var(--purple);font-size:0.72rem;font-weight:800;text-transform:uppercase;letter-spacing:0.08em;padding:14px 16px;text-align:left;border-bottom:1px solid #E5E7EB;white-space:nowrap}
.admin-table td{padding:14px 16px;font-size:0.85rem;border-bottom:1px solid #F3F4F6;vertical-align:middle;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.admin-table tr:last-child td{border-bottom:none}
.admin-table tr:hover td{background:#FAFAFA}
.status-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:50px;font-size:0.72rem;font-weight:700;letter-spacing:0.04em}
.badge-pending{background:#FEF3C7;color:#92400E}
.badge-verified{background:#D1FAE5;color:#065F46}
.badge-sold{background:#DBEAFE;color:#1E40AF}
.badge-new{background:#FEF3C7;color:#92400E}
.badge-contacted{background:#D1FAE5;color:#065F46}
.badge-closed{background:#F3F4F6;color:#374151}
.action-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn-action{padding:5px 10px;border-radius:6px;font-size:0.75rem;font-weight:700;cursor:pointer;border:none;transition:var(--transition);font-family:inherit;white-space:nowrap}
.btn-verify{background:#D1FAE5;color:#065F46}.btn-verify:hover{background:#059669;color:#fff}
.btn-sold{background:#DBEAFE;color:#1E40AF}.btn-sold:hover{background:#1D4ED8;color:#fff}
.btn-delete{background:#FEE2E2;color:#991B1B}.btn-delete:hover{background:#DC2626;color:#fff}
.btn-contact{background:#EDE9FE;color:#5B21B6}.btn-contact:hover{background:var(--purple);color:#fff}
.btn-close-lead{background:#F3F4F6;color:#374151}.btn-close-lead:hover{background:#6B7280;color:#fff}
.empty-row td{text-align:center;color:var(--muted);padding:40px;font-size:0.9rem}
.search-bar{display:flex;gap:10px;align-items:center}
.search-bar input{border:1.5px solid #E5E7EB;border-radius:8px;padding:9px 14px;font-size:0.85rem;font-family:inherit;color:var(--text);transition:var(--transition);min-width:220px}
.search-bar input:focus{outline:none;border-color:var(--purple)}
.overflow-x{overflow-x:auto}
@media(max-width:900px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stats-grid{grid-template-columns:1fr}.tabs{width:100%;flex-direction:column}.tab-btn{text-align:left}}
</style>
</head>
<body>
<div id="loginWrap" class="login-wrap">
  <div class="login-card">
    <div class="login-logo">
      <img src="assets/logo1.png" alt="OWMD Logo">
      <p>Admin Dashboard</p>
    </div>
    <h2 class="login-title">Sign In</h2>
    <form onsubmit="doLogin(event)">
      <div class="login-group"><label>Email</label><input type="email" id="loginEmail" placeholder="admin@owmd.com" autocomplete="username"></div>
      <div class="login-group"><label>Password</label><input type="password" id="loginPass" placeholder="••••••••" autocomplete="current-password"></div>
      <div class="login-error" id="loginError">Invalid email or password</div>
      <button type="submit" class="btn-login">Sign In →</button>
    </form>
  </div>
</div>
<div id="dashboard" class="dashboard">
  <header class="dash-header">
    <div class="dash-header-inner">
      <div class="dash-logo">
        <div class="dash-logo-pill"><img src="assets/logo1.png" alt="OWMD Logo"></div>
        <span>Admin Panel</span>
      </div>
      <div class="dash-header-right">
        <div class="dash-badge">🛡️ OWMD Team</div>
        <a href="index.html" class="btn-logout" style="text-decoration:none">← Site</a>
        <button class="btn-logout" onclick="doLogout()">Sign Out</button>
      </div>
    </div>
  </header>
  <div class="dash-content">
    <div class="stats-grid" id="statsGrid"></div>
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('listings',this)">🏘 All Listings</button>
      <button class="tab-btn" onclick="switchTab('interests',this)">💬 Buyer Interests</button>
    </div>
    <div class="tab-panel active" id="tab-listings">
      <div class="panel-header">
        <div class="panel-title">All Property Listings</div>
        <div class="search-bar"><input type="text" id="listingSearch" placeholder="Search listings..." oninput="renderListings()"></div>
      </div>
      <div class="table-wrap overflow-x">
        <table class="admin-table">
          <thead><tr><th>ID</th><th>Type</th><th>Location</th><th>Price</th><th>Size</th><th>Seller</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="listingsTbody"></tbody>
        </table>
      </div>
    </div>
    <div class="tab-panel" id="tab-interests">
      <div class="panel-header">
        <div class="panel-title">Buyer Interests</div>
        <div class="search-bar"><input type="text" id="interestSearch" placeholder="Search buyers..." oninput="renderInterests()"></div>
      </div>
      <div class="table-wrap overflow-x">
        <table class="admin-table">
          <thead><tr><th>Buyer Name</th><th>Phone</th><th>Email</th><th>Property</th><th>Message</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
          <tbody id="interestsTbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script>
const ADMIN_EMAIL = 'admin@onlywhitemoneydeals.com';
const ADMIN_PASS = 'owmd@admin2024';
const STORAGE_KEY = 'owmd_listings';
const INTERESTS_KEY = 'owmd_interests';
const SESSION_KEY = 'owmd_admin_session';

const SAMPLE_LISTINGS = [
  {id:'s1',type:'Flat',location:'Indirapuram',price:8500000,size:1450,bedrooms:3,description:'Spacious 3BHK flat in prime Indirapuram.',status:'verified',created:new Date('2026-04-10').toISOString(),seller_name:'OWMD Demo',seller_phone:'9910805491',seller_email:'demo@owmd.com',photos:[]},
  {id:'s2',type:'Builder Floor',location:'Vasundhara',price:11000000,size:1800,bedrooms:4,description:'Independent 4BHK builder floor in Vasundhara.',status:'verified',created:new Date('2026-04-15').toISOString(),seller_name:'OWMD Demo',seller_phone:'9910805491',seller_email:'demo@owmd.com',photos:[]},
  {id:'s3',type:'Shop',location:'Kaushambi',price:5000000,size:320,bedrooms:0,description:'Commercial shop on main road.',status:'verified',created:new Date('2026-04-20').toISOString(),seller_name:'OWMD Demo',seller_phone:'9910805491',seller_email:'demo@owmd.com',photos:[]},
  {id:'s4',type:'Plot',location:'Noida',price:15000000,size:250,bedrooms:0,description:'Prime residential plot in Noida Sector 137.',status:'pending',created:new Date('2026-05-01').toISOString(),seller_name:'Rajesh Kumar',seller_phone:'9876543210',seller_email:'rajesh@email.com',photos:[]},
  {id:'s5',type:'Office',location:'Greater Noida',price:7500000,size:900,bedrooms:0,description:'Modern office space in Knowledge Park.',status:'verified',created:new Date('2026-05-05').toISOString(),seller_name:'OWMD Demo',seller_phone:'9910805491',seller_email:'demo@owmd.com',photos:[]},
  {id:'s6',type:'Flat',location:'Noida',price:6200000,size:1100,bedrooms:2,description:'Compact 2BHK flat in Noida Sector 62.',status:'pending',created:new Date('2026-05-08').toISOString(),seller_name:'Priya Sharma',seller_phone:'9988776655',seller_email:'priya@email.com',photos:[]}
];

function getAllListings(){
  const stored = JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]');
  const sampleIds = SAMPLE_LISTINGS.map(s=>s.id);
  const custom = stored.filter(l=>!sampleIds.includes(l.id));
  return [...SAMPLE_LISTINGS,...custom];
}

function saveCustomListings(all){
  const custom = all.filter(l=>!['s1','s2','s3','s4','s5','s6'].includes(l.id));
  localStorage.setItem(STORAGE_KEY,JSON.stringify(custom));
}

function formatPrice(p){
  if(p>=10000000) return '₹'+(p/10000000).toFixed(2)+' Cr';
  if(p>=100000) return '₹'+(p/100000).toFixed(1)+' L';
  return '₹'+p.toLocaleString('en-IN');
}

function formatDate(d){
  return new Date(d).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
}

function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(email===ADMIN_EMAIL && pass===ADMIN_PASS){
    sessionStorage.setItem(SESSION_KEY,'1');
    document.getElementById('loginWrap').style.display='none';
    document.getElementById('dashboard').classList.add('active');
    initDashboard();
  } else {
    document.getElementById('loginError').classList.add('show');
  }
}

function doLogout(){
  sessionStorage.removeItem(SESSION_KEY);
  location.reload();
}

function initDashboard(){
  renderStats();
  renderListings();
  renderInterests();
}

function renderStats(){
  const listings = getAllListings();
  const interests = JSON.parse(localStorage.getItem(INTERESTS_KEY)||'[]');
  const pending = listings.filter(l=>l.status==='pending').length;
  const verified = listings.filter(l=>l.status==='verified').length;
  document.getElementById('statsGrid').innerHTML=`
    <div class="stat-card purple"><div class="stat-icon">🏘️</div><div class="stat-value">${listings.length}</div><div class="stat-label">Total Listings</div></div>
    <div class="stat-card amber"><div class="stat-icon">⏳</div><div class="stat-value">${pending}</div><div class="stat-label">Pending Review</div></div>
    <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-value">${verified}</div><div class="stat-label">Verified Listings</div></div>
    <div class="stat-card blue"><div class="stat-icon">💬</div><div class="stat-value">${interests.length}</div><div class="stat-label">Buyer Interests</div></div>`;
}

function switchTab(name, btn){
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
}

function renderListings(){
  const q = (document.getElementById('listingSearch').value||'').toLowerCase();
  let listings = getAllListings();
  if(q) listings = listings.filter(l=>(l.type+l.location+l.seller_name).toLowerCase().includes(q));
  const badge = s=>s==='verified'?'badge-verified':s==='sold'?'badge-sold':'badge-pending';
  const label = s=>s==='verified'?'✅ Verified':s==='sold'?'🔵 Sold':'⏳ Pending';
  const isSample = id=>['s1','s2','s3','s4','s5','s6'].includes(id);
  const rows = listings.map(l=>`<tr>
    <td title="${l.id}">${l.id.slice(0,8)}…</td>
    <td><strong>${l.type}</strong></td>
    <td>${l.location}</td>
    <td>${formatPrice(l.price)}</td>
    <td>${l.size.toLocaleString()} sqft</td>
    <td title="${l.seller_phone}">${l.seller_name}</td>
    <td>${formatDate(l.created)}</td>
    <td><span class="status-badge ${badge(l.status)}">${label(l.status)}</span></td>
    <td><div class="action-btns">
      ${l.status!=='verified'&&!isSample(l.id)?`<button class="btn-action btn-verify" onclick="verifyListing('${l.id}')">Verify</button>`:''}
      ${l.status==='verified'&&!isSample(l.id)?`<button class="btn-action btn-sold" onclick="markSold('${l.id}')">Sold</button>`:''}
      <button class="btn-action btn-contact" onclick="contactSeller('${l.seller_phone}','${l.type}','${l.location}')">📞</button>
      ${!isSample(l.id)?`<button class="btn-action btn-delete" onclick="deleteListing('${l.id}')">Delete</button>`:''}
    </div></td>
  </tr>`).join('');
  document.getElementById('listingsTbody').innerHTML = rows||`<tr class="empty-row"><td colspan="9">No listings found.</td></tr>`;
}

function verifyListing(id){
  if(!confirm('Verify this listing? It will become visible to buyers.')) return;
  let all = getAllListings();
  const idx = all.findIndex(l=>l.id===id);
  if(idx>-1){all[idx].status='verified';saveCustomListings(all);}
  renderStats();renderListings();
}

function markSold(id){
  let all = getAllListings();
  const idx = all.findIndex(l=>l.id===id);
  if(idx>-1){all[idx].status='sold';saveCustomListings(all);}
  renderStats();renderListings();
}

function deleteListing(id){
  if(!confirm('Delete this listing? This cannot be undone.')) return;
  let all = getAllListings();
  all = all.filter(l=>l.id!==id);
  saveCustomListings(all);
  renderStats();renderListings();
}

function contactSeller(phone, type, location){
  const msg = `Hi, I am from OWMD team. Your ${type} listing in ${location} is being reviewed. Please share more details.`;
  window.open(`https://wa.me/91${phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
}

function renderInterests(){
  const q = (document.getElementById('interestSearch').value||'').toLowerCase();
  let interests = JSON.parse(localStorage.getItem(INTERESTS_KEY)||'[]');
  if(q) interests = interests.filter(i=>(i.buyer_name+i.buyer_phone+i.property_label).toLowerCase().includes(q));
  const badge = s=>s==='new'?'badge-new':s==='contacted'?'badge-contacted':'badge-closed';
  const label = s=>s==='new'?'🆕 New':s==='contacted'?'✅ Contacted':'🔒 Closed';
  const rows = interests.map((i,idx)=>`<tr>
    <td><strong>${i.buyer_name}</strong></td>
    <td><a href="tel:${i.buyer_phone}" style="color:var(--purple)">${i.buyer_phone}</a></td>
    <td>${i.buyer_email||'—'}</td>
    <td title="${i.property_label}">${(i.property_label||'').slice(0,25)}…</td>
    <td title="${i.message||''}">${(i.message||'—').slice(0,30)}${i.message&&i.message.length>30?'…':''}</td>
    <td>${formatDate(i.created)}</td>
    <td><span class="status-badge ${badge(i.status||'new')}">${label(i.status||'new')}</span></td>
    <td><div class="action-btns">
      ${(i.status||'new')!=='contacted'?`<button class="btn-action btn-contact" onclick="contactBuyer(${idx})">📞 Contact</button>`:''}
      ${(i.status||'new')!=='closed'?`<button class="btn-action btn-close-lead" onclick="closeLead(${idx})">Close</button>`:''}
    </div></td>
  </tr>`).join('');
  document.getElementById('interestsTbody').innerHTML = rows||`<tr class="empty-row"><td colspan="8">No buyer interests yet.</td></tr>`;
}

function contactBuyer(idx){
  const interests = JSON.parse(localStorage.getItem(INTERESTS_KEY)||'[]');
  const i = interests[idx];
  if(!i) return;
  const msg = `Hi ${i.buyer_name}, I am from OWMD team. You recently expressed interest in ${i.property_label}. Let me share more details with you.`;
  window.open(`https://wa.me/91${i.buyer_phone.replace(/[^0-9]/g,'')}?text=${encodeURIComponent(msg)}`,'_blank');
  interests[idx].status='contacted';
  localStorage.setItem(INTERESTS_KEY,JSON.stringify(interests));
  renderStats();renderInterests();
}

function closeLead(idx){
  const interests = JSON.parse(localStorage.getItem(INTERESTS_KEY)||'[]');
  if(interests[idx]) interests[idx].status='closed';
  localStorage.setItem(INTERESTS_KEY,JSON.stringify(interests));
  renderStats();renderInterests();
}

if(sessionStorage.getItem(SESSION_KEY)){
  document.getElementById('loginWrap').style.display='none';
  document.getElementById('dashboard').classList.add('active');
  initDashboard();
}
</script>
</body></html>
